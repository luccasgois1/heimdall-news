# Publica o briefing no GitHub Pages a cada push. O site leva os briefings, as imagens, o espectro e
# as votações de cada governo (mandatos/) com os dados usados (dados/);
# o áudio fica só no repositório (as páginas mostram o vídeo do dia no YouTube).
name: Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Montar o site
        run: |
          mkdir -p _site
          cp -r briefing img estudos mandatos dados _site/
          cat > _site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>Heimdall News</title>
          <meta http-equiv="refresh" content="0; url=briefing/index.html">
          <a href="briefing/index.html">Heimdall News — briefings</a>
          HTML
          touch _site/.nojekyll
          du -sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
